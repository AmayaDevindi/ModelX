# Daily data refresh - switched ON 8 Nov 2026.
name: daily-refresh

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 6:00 pm Sri Lanka time, weekdays (after CSE closes)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python src/data/run_pipeline.py
      - name: Commit new data
        run: |
          git config user.name "daily-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily refresh $(date +%F)"
          git push
